name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build release
        run: swift build -c release

      - name: Test
        run: swift test --parallel

  linux-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: linux/go.sum

      - name: Test
        working-directory: linux
        run: go test ./...

      - name: Build
        working-directory: linux
        run: go build -o cryptomako .

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Trivy filesystem scan (NVD-backed)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: .build,.swiftpm,fixtures/vault

      - name: Grype lockfile scan (Swift PM / NVD)
        id: grype
        uses: anchore/scan-action@v6
        with:
          path: Package.resolved
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
        continue-on-error: true
