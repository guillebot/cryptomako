name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build release
        run: swift build -c release

      - name: Test
        run: swift test --parallel

  linux-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: linux/go.sum

      - name: Test
        working-directory: linux
        run: go test ./...

      - name: Build
        working-directory: linux
        run: go build -o cryptomako .

  linux-fuse-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: linux/go.sum

      - name: Install fuse3
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Build CLI
        working-directory: linux
        run: go build -o cryptomako .

      - name: FUSE smoke (ro + rw)
        working-directory: linux
        env:
          CRYPTOMAKO_PASSWORD: ci-fuse-smoke-password
          CRYPTOMAKO_BIN: ${{ github.workspace }}/linux/cryptomako
          CRYPTOMAKO_FUSE_RW: "1"
        run: ./scripts/fuse-smoke.sh


  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: linux/go.sum

      - name: Build .deb
        working-directory: linux
        run: ./packaging/build-deb.sh
        env:
          # CI artifact only; release uploads use release.yml from the tag version.
          VERSION: "0.0.0-ci"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptomako-deb
          path: linux/packaging/dist/*.deb
          if-no-files-found: error

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  windows-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, audit, and test
        working-directory: windows
        run: |
          dotnet restore CryptoMako.sln
          dotnet test tests/CryptoMako.Vault.Tests/CryptoMako.Vault.Tests.csproj --configuration Release --no-restore
