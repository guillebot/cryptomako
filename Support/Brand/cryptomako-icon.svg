<?xml version="1.0" encoding="UTF-8"?>
<!-- CryptoMako: bucket + keyhole only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="CryptoMako">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031820"/>
      <stop offset="0.55" stop-color="#0A4A55"/>
      <stop offset="1" stop-color="#15948E"/>
    </linearGradient>
    <linearGradient id="bucket" x1="280" y1="280" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FCFC"/>
      <stop offset="1" stop-color="#B8E4E4"/>
    </linearGradient>
    <linearGradient id="bucketShade" x1="512" y1="320" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E5C63" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#021014" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>

  <!-- S3-style bucket -->
  <g filter="url(#softShadow)">
    <path
      d="M260 340
         C260 292 392 250 512 250
         C632 250 764 292 764 340
         L736 780
         C736 832 632 870 512 870
         C392 870 288 832 288 780
         Z"
      fill="url(#bucket)"
    />
    <ellipse cx="512" cy="340" rx="252" ry="58" fill="#FFFFFF" opacity="0.55"/>
    <path
      d="M260 340
         C260 292 392 250 512 250
         C632 250 764 292 764 340"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      opacity="0.7"
    />
    <path
      d="M260 340
         C260 292 392 250 512 250
         C632 250 764 292 764 340
         L736 780
         C736 832 632 870 512 870
         C392 870 288 832 288 780
         Z"
      fill="url(#bucketShade)"
    />
  </g>

  <!-- Keyhole -->
  <circle cx="512" cy="560" r="72" fill="#0A4A55"/>
  <path d="M512 620 L470 760 L554 760 Z" fill="#0A4A55"/>
  <circle cx="512" cy="560" r="28" fill="#7CF0E7" opacity="0.28"/>
</svg>
